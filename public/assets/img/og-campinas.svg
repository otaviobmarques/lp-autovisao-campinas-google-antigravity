<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E7E8"/>
    </linearGradient>
    <clipPath id="carWindows">
      <path d="M226 136 263 101h85v35z"/>
      <path d="M356 136V100l110-1c13 0 21 4 28 12l21 25z"/>
    </clipPath>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo Vermelho Marca #ED3237 -->
  <rect width="1200" height="630" fill="#ED3237"/>

  <!-- 8 Círculos Concêntricos (Preto a 9% sobre o vermelho - DS Seção 3) -->
  <g transform="translate(1060, 300)" fill="none" stroke="#000000" stroke-opacity="0.09" stroke-width="34">
    <circle r="60"/>
    <circle r="130"/>
    <circle r="200"/>
    <circle r="270"/>
    <circle r="340"/>
    <circle r="410"/>
    <circle r="480"/>
    <circle r="550"/>
  </g>

  <!-- Selo Superior Direito: Credenciadas DETRAN-SP -->
  <g transform="translate(804, 38)">
    <rect width="336" height="44" rx="22" fill="rgba(21,20,21,0.25)" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
    <circle cx="28" cy="22" r="9" fill="#25D366"/>
    <path d="M24 22l3 3 6-6" stroke="#0B3B22" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">5 Lojas Credenciadas DETRAN-SP</text>
  </g>

  <!-- Coluna Esquerda: Kicker + Título em Duas Partes + Lista de Serviços + CTA WhatsApp -->
  <g transform="translate(64, 134)">
    <rect x="0" y="0" width="38" height="6" rx="3" fill="#FFFFFF"/>
    <text x="50" y="9" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" letter-spacing="2.5">VISTORIA VEICULAR EM CAMPINAS</text>

    <text x="0" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="normal" font-size="52" fill="#FFFFFF">Quem você ama</text>
    <text x="0" y="128" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="60" fill="#FFFFFF">merece um carro</text>
    <text x="0" y="188" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="60" fill="#FFFFFF">vistoriado.</text>

    <text x="0" y="236" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">• Vistoria do DETRAN (Transferência)   • Vistoria Cautelar</text>
    <text x="0" y="266" font-family="Arial, Helvetica, sans-serif" font-weight="normal" font-size="18" fill="rgba(255,255,255,0.92)">• Vistoria 360º® (+180 itens)  • Pintura  • Scanner KM  • Elétricos  • Pesados</text>

    <!-- Botão CTA WhatsApp #25D366 + Número ao lado -->
    <g transform="translate(0, 294)">
      <rect width="292" height="64" rx="14" fill="#25D366" filter="url(#cardShadow)"/>
      <text x="146" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#0B3B22">Agende pelo WhatsApp</text>
      <text x="312" y="42" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="30" fill="#FFFFFF">(19) 99224-8383</text>
    </g>
  </g>

  <!-- Coluna Direita: Lupa + Placa Mercosul + Carro de Família + Etiquetas Flutuantes -->
  <g transform="translate(955, 118) scale(0.86)" filter="url(#cardShadow)">
    <circle cx="86" cy="86" r="62" fill="rgba(255,255,255,0.12)" stroke="#FFFFFF" stroke-width="22"/>
    <path d="M134 134l42 42" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
    <circle cx="86" cy="86" r="16" fill="#151415"/>
  </g>

  <!-- Placa Mercosul Ilustrativa ABC1D23 (DS Seção 6) -->
  <g transform="translate(656, 128) rotate(-4)" filter="url(#cardShadow)">
    <rect width="224" height="82" rx="14" fill="#FFFFFF" stroke="#151415" stroke-width="6"/>
    <path d="M4 14 C4 8 8 4 14 4 L210 4 C216 4 220 8 220 14 L220 26 L4 26 Z" fill="#1D3A8A"/>
    <text x="112" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" letter-spacing="4">BRASIL</text>
    <text x="112" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#151415" letter-spacing="2">ABC1D23</text>
  </g>

  <!-- Carro de Família em Perfil Perfeito Esquerda (DS Seção 4) -->
  <g transform="translate(636, 245) scale(0.86)">
    <ellipse cx="300" cy="250" rx="270" ry="13" fill="#000000" opacity="0.24"/>
    <path fill="url(#carBody)" d="M48 230H40c-8 0-12-5-12-14v-24c2-18 14-27 34-31l126-22c11-2 20-7 28-14l38-32c8-7 18-10 30-10l188-2c17 0 29 5 38 14l40 40c13 9 20 20 21 35l2 46c0 9-5 14-13 14h-36a52 52 0 0 0-104 0H192a52 52 0 0 0-104 0z"/>
    <path fill="#1A1A1A" d="M226 136 263 101h85v35zM356 136V100l110-1c13 0 21 4 28 12l21 25z"/>
    <g clip-path="url(#carWindows)" fill="#3A3A3C">
      <circle cx="300" cy="113" r="12"/><path d="M276 140c2-14 12-20 24-20s22 6 24 20z"/>
      <circle cx="388" cy="121" r="9"/><path d="M370 140c2-10 9-15 18-15s16 5 18 15z"/>
      <circle cx="440" cy="114" r="11"/><path d="M418 140c2-13 11-19 22-19s20 6 22 19z"/>
    </g>
    <path d="M352 100v76M226 140l-8 52M520 140v40" stroke="#CFCBCD" stroke-width="2" fill="none"/>
    <path d="M30 196h548" stroke="#D9D5D7" stroke-width="2"/>
    <rect x="300" y="150" width="26" height="6" rx="3" fill="#BDB8BA"/>
    <rect x="430" y="150" width="26" height="6" rx="3" fill="#BDB8BA"/>
    <path d="M30 184c10-2 22-2 34 0v12H30z" fill="#FFE7A3"/>
    <path d="M560 160h14l2 22h-16z" fill="#C9232C"/>
    <g><circle cx="140" cy="230" r="40" fill="#1A1A1A"/><circle cx="140" cy="230" r="21" fill="#9A9597"/><circle cx="140" cy="230" r="7" fill="#1A1A1A"/></g>
    <g><circle cx="472" cy="230" r="40" fill="#1A1A1A"/><circle cx="472" cy="230" r="21" fill="#9A9597"/><circle cx="472" cy="230" r="7" fill="#1A1A1A"/></g>
  </g>

  <!-- Etiqueta Flutuante 1 -->
  <g transform="translate(620, 456)" filter="url(#cardShadow)">
    <rect width="242" height="66" rx="16" fill="#FFFFFF"/>
    <circle cx="35" cy="33" r="21" fill="#ED3237"/>
    <path d="M27 33l5 5 11-11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="30" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="19" fill="#151415">Vistoria 360º®</text>
    <text x="66" y="50" font-family="Arial, Helvetica, sans-serif" font-weight="normal" font-size="14" fill="#696267">+180 itens avaliados</text>
  </g>

  <!-- Etiqueta Flutuante 2 -->
  <g transform="translate(888, 456)" filter="url(#cardShadow)">
    <rect width="252" height="66" rx="16" fill="#FFFFFF"/>
    <circle cx="35" cy="33" r="21" fill="#18743B"/>
    <path d="M27 33l5 5 11-11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="30" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="19" fill="#151415">Laudo na Hora</text>
    <text x="66" y="50" font-family="Arial, Helvetica, sans-serif" font-weight="normal" font-size="14" fill="#696267">Plantão Sábado até 16h</text>
  </g>

  <!-- Barra de Unidades Base -->
  <rect x="0" y="550" width="1200" height="44" fill="#151415"/>
  <text x="600" y="578" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" letter-spacing="0.8">
    5 LOJAS EM CAMPINAS: TAQUARAL · CENTRO · PONTE PRETA (ABOLIÇÃO) · CAMPOS ELÍSEOS · AMOREIRAS
  </text>
</svg>
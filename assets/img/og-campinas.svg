    <text x="62" y="48" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="13" fill="#696267">Vistoria 360º® Exclusiva</text>
  </g>

  <!-- Etiqueta Flutuante 2 -->
  <g transform="translate(920, 465)" filter="url(#cardShadow)">
    <rect width="225" height="64" rx="14" fill="#FFFFFF"/>
    <circle cx="32" cy="32" r="20" fill="#ED3237"/>
    <path d="M24 32l5 5 11-11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="29" font-family="Nunito, Arial Black, sans-serif" font-weight="900" font-size="18" fill="#151415">Laudo na Hora</text>
    <text x="62" y="48" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="13" fill="#696267">Taquaral · Centro · Abolição</text>
  </g>

  <!-- Barra de Benefícios Base -->
  <rect x="0" y="556" width="1200" height="42" fill="#151415"/>
  <text x="600" y="582" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" letter-spacing="0.5">
    5 LOJAS EM CAMPINAS (TAQUARAL · CENTRO · PONTE PRETA · CAMPOS ELÍSEOS · AMOREIRAS)  ·  PLANTÃO AOS SÁBADOS ATÉ 16H
  </text>


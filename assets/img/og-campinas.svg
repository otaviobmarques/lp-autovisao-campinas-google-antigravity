<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E7E8"/>
    </linearGradient>
    <clipPath id="carWindows">
      <path d="M226 136 263 101h85v35z"/>
      <path d="M356 136V100l110-1c13 0 21 4 28 12l21 25z"/>
    </clipPath>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Fundo Vermelho Marca #ED3237 -->
  <rect width="1200" height="630" fill="#ED3237"/>

  <!-- 8 Círculos Concêntricos (Preto a 9%) -->
  <g transform="translate(1050, 315)" fill="none" stroke="#000000" stroke-opacity="0.09" stroke-width="34">
    <circle r="60"/>
    <circle r="130"/>
    <circle r="200"/>
    <circle r="270"/>
    <circle r="340"/>
    <circle r="410"/>
    <circle r="480"/>
    <circle r="550"/>
  </g>

  <!-- Topo: Marca e Selo DETRAN -->
  <g transform="translate(72, 48)">
    <text x="0" y="34" font-family="Nunito, Arial Black, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="-1">autovisão</text>
    <circle cx="101" cy="22" r="5" fill="#151415"/>
    <text x="2" y="50" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" letter-spacing="3.5" opacity="0.9">VISTORIAS AUTOMOTIVAS</text>
  </g>

  <g transform="translate(880, 48)">
    <rect width="248" height="40" rx="20" fill="rgba(21,20,21,0.22)" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <text x="124" y="25" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">5 Lojas Credenciadas DETRAN-SP</text>
  </g>

  <!-- Coluna Esquerda: Kicker + Título Leve + Título Impacto + CTA -->
  <g transform="translate(72, 152)">
    <rect x="0" y="0" width="32" height="5" rx="2.5" fill="#FFFFFF"/>
    <text x="44" y="8" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" letter-spacing="2.5">VISTORIA VEICULAR EM CAMPINAS</text>

    <text x="0" y="64" font-family="Nunito, Arial, sans-serif" font-weight="300" font-size="52" fill="#FFFFFF">Quem você ama</text>
    <text x="0" y="120" font-family="Nunito, Arial Black, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF">merece um carro</text>
    <text x="0" y="176" font-family="Nunito, Arial Black, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF">vistoriado.</text>

    <text x="0" y="222" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="19" fill="rgba(255,255,255,0.92)">Vistoria do DETRAN · Vistoria Cautelar · Vistoria 360º®</text>
    <text x="0" y="248" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="19" fill="rgba(255,255,255,0.92)">Pintura · Scanner KM · Bateria Elétricos · Pesados · Premium</text>

    <!-- Botão WhatsApp -->
    <g transform="translate(0, 280)">
      <rect width="276" height="60" rx="12" fill="#25D366"/>
      <text x="138" y="37" text-anchor="middle" font-family="Nunito, Arial Black, sans-serif" font-weight="900" font-size="21" fill="#0B3B22">Agende pelo WhatsApp</text>
      <text x="296" y="39" font-family="Nunito, Arial Black, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF">(19) 99224-8383</text>
    </g>
  </g>

